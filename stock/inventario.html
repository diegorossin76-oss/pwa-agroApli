<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestionStock</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --input-bg: #0f172a;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-green);
            margin: 0;
        }

        .badge-conexion {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .dot.error {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .badge-conexion.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-green);
        }

        input[readonly] {
            color: var(--text-muted);
            cursor: not-allowed;
            background-color: #0b1120 !important;
        }

        button {
            width: 100%;
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-green-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .loading { 
            font-size: 12px; 
            color: var(--text-muted); 
            font-style: italic; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="app-title">AgroGestionStock</h1>
        <div id="badgeConexion" class="badge-conexion">
            <span id="dotConexion" class="dot"></span>
            <span id="txtConexion">Conectado a Google Sheets</span>
        </div>
    </div>
    
    <div class="form-group">
        <label>Fecha:</label>
        <input type="date" id="fecha" required>
    </div>

    <div class="form-group">
        <label>Producto:</label>
        <select id="producto" onchange="actualizarPrincipioActivo()" required>
            <option value="">Cargando productos...</option>
        </select>
    </div>

    <div class="form-group">
        <label>Principio Activo:</label>
        <input type="text" id="principioActivo" placeholder="Se completa solo..." readonly>
    </div>

    <div class="form-group">
        <label>Cantidad (Litros/Kilos):</label>
        <input type="number" id="cantidad" step="0.01" required>
    </div>

    <button onclick="guardarStock()">Ingresar Stock</button>
</div>

<script>
    // URL de tu Apps Script (Reemplazar con la tuya)
    const urlScript = 'https://script.google.com/macros/s/AKfycbw27yNxr1wNDU5P51N9ox4rjwur-s1trui-Bxh6eu9GRf4GiMoRecP647ao9d4mweu2hg/exec'; 

    // Guardamos la lista completa de productos para consultar sus datos fácilmente
    let listaProductosGlobal = [];

    // Fecha de hoy por defecto
    document.getElementById('fecha').valueAsDate = new Date();

    // Al cargar la página, traemos los datos de Maestros mediante doGet
    window.onload = function() {
        fetch(urlScript)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success" && data.maestros && data.maestros.productos) {
                    listaProductosGlobal = data.maestros.productos;
                    const selectProd = document.getElementById('producto');
                    selectProd.innerHTML = '<option value="">Seleccione un producto...</option>';
                    
                    listaProductosGlobal.forEach(prod => {
                        let opt = document.createElement('option');
                        opt.value = prod.nombre;
                        opt.textContent = prod.nombre;
                        selectProd.appendChild(opt);
                    });
                    marcarConexion(true);
                } else {
                    alert("Error al cargar los productos maestros.");
                    marcarConexion(false);
                }
            })
            .catch(err => {
                console.error(err);
                alert("No se pudo conectar con el servidor para traer los productos.");
                marcarConexion(false);
            });
    };

    function marcarConexion(estado) {
        const badge = document.getElementById('badgeConexion');
        const dot = document.getElementById('dotConexion');
        const txt = document.getElementById('txtConexion');
        if(estado) {
            badge.classList.remove('error');
            dot.classList.remove('error');
            txt.textContent = "Conectado a Google Sheets";
        } else {
            badge.classList.add('error');
            dot.classList.add('error');
            txt.textContent = "Sin conexión";
        }
    }

    // Función para autocompletar el principio activo según el producto elegido
    function actualizarPrincipioActivo() {
        const nombreSeleccionado = document.getElementById('producto').value;
        const inputPA = document.getElementById('principioActivo');

        const productoEncontrado = listaProductosGlobal.find(p => p.nombre === nombreSeleccionado);
        if (productoEncontrado) {
            inputPA.value = productoEncontrado.principioActivo;
        } else {
            inputPA.value = '';
        }
    }

    // Función para enviar la compra al Apps Script
    function guardarStock() {
        const fecha = document.getElementById('fecha').value;
        const producto = document.getElementById('producto').value;
        const principio = document.getElementById('principioActivo').value;
        const cantidad = document.getElementById('cantidad').value;

        if(!producto || !cantidad) {
            alert("Completá el producto y la cantidad.");
            return;
        }

        const datosStock = {
            tipoAccion: "ingreso_stock", // Clave que lee el doPost del servidor
            fecha: fecha,
            producto: producto,
            principioActivo: principio,
            cantidad: cantidad
        };

        fetch(urlScript, {
            method: 'POST',
            body: JSON.stringify(datosStock)
        })
        .then(res => res.json())
        .then(data => {
            alert("¡Stock ingresado correctamente!");
            document.getElementById('cantidad').value = '';
            document.getElementById('producto').value = '';
            document.getElementById('principioActivo').value = '';
            marcarConexion(true);
        })
        .catch(error => {
            alert("Error al guardar el stock: " + error);
            marcarConexion(false);
        });
    }
</script>

</body>
</html>
